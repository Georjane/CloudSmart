name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm install

      - name: Run linters
        working-directory: ${{ matrix.project }}
        run: npm run lint || npm run lint:fix

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: npm test

      - name: Build project
        working-directory: ${{ matrix.project }}
        run: npm run build
